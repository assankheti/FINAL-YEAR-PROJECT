services:
  - type: web
    name: assan-kheti-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: app-assankheti-backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: bash start.sh
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: src
      - key: UPLOAD_ROOT
        value: /tmp/uploads
      - key: MONGO_DB_NAME
        value: dbasssankheti
      - key: MONGODB_SERVER_SELECTION_TIMEOUT_MS
        value: "5000"
      - key: PLATFORM_COMMISSION_RATE
        value: "0.10"
      - key: PLATFORM_SERVICE_FEE_PKR
        value: "100"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: STYTCH_ENV
        value: live
      - key: STYTCH_ENVIRONMENT
        value: live
      - key: ENABLE_OFFLINE_DISEASE_MODEL
        value: "false"
      - key: RUN_STARTUP_SCRAPERS
        value: "false"
      - key: RUN_PERIODIC_SCRAPERS
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: STYTCH_PROJECT_ID
        sync: false
      - key: STYTCH_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_ADMIN_MOBILE_IDS
        sync: false
      - key: STREAM_APP_ID
        sync: false
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: STREAM_ADMIN_MOBILE_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false
